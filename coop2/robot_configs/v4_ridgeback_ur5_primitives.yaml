# Primitives-style config for the imported Clearpath Ridgeback + UR5.
#
# The shape mirrors OmniGibson's own `r1_primitives.yaml` because
# `build_multi_robot_config` takes its env/scene skeleton from here and uses
# `robots[0]` as the per-robot template. Only the robot entry differs.
#
# Three settings below are what a *suction* end effector needs, and each was
# found by loading the robot rather than by reading. OmniGibson's manipulation
# path assumes a finger gripper in four places; this config answers three of
# them (the fourth, an empty-list dtype in `gripper_control_idx`, was a real bug
# and is fixed in robot.py).
env:
  action_frequency: 30
  physics_frequency: 120
  device: null
  automatic_reset: false
  flatten_action_space: false
  flatten_obs_space: false
  use_external_obs: false
  external_sensors: null

render:
  viewer_width: 1280
  viewer_height: 720

scene:
  type: InteractiveTraversableScene
  scene_model: Rs_int
  trav_map_resolution: 0.1
  default_erosion_radius: 0.0
  trav_map_with_objects: true
  num_waypoints: 1
  waypoint_resolution: 0.2
  load_object_categories: null
  not_load_object_categories: null
  load_room_types: null
  load_room_instances: null
  load_task_relevant_only: false
  # 0.1, not the shipped 1.0. At 1 m the whole of Merom_1_int is a 20x20 grid
  # and room membership is decided by which of 400 cells an object's centre
  # lands in -- which is wrong, not merely coarse. Measured against the scene's
  # own in_rooms annotations, 13 of 13 cabinets agree at 0.1 and only 4 at 1.0:
  # seven land on a boundary cell and read as no room at all, and the two
  # bedroom cabinets nearest the party wall read as childs_room_0. That turned
  # v4_s1_v4_lh from 'carry it to the bedroom' into 'put it on the cabinet
  # behind you', and left v4_s1_v4_hh's dining-room notebook in no room.
  seg_map_resolution: 0.1
  scene_source: OG
  include_robots: false

robots:
  - model: v4_ridgeback_ur5
    obs_modalities: [rgb]
    include_sensor_names: null
    exclude_sensor_names: null
    scale: 1.0
    self_collisions: true
    action_normalize: false
    action_type: continuous
    # Not "physical": that branch of `is_grasping` reads a gripper controller
    # this robot has none of. "sticky" takes the `_ag_obj_in_hand` branch, which
    # is the one the symbolic primitives drive through `_establish_grasp`.
    grasping_mode: sticky
    # OmniGibson otherwise runs its own assisted-grasp handling every physics
    # step, and that too reads `gripper_<arm>`. The symbolic layer calls
    # `_establish_grasp` and `release_grasp_immediately` itself, which is
    # exactly the case this flag is documented for.
    disable_grasp_handling: true
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 128
          image_width: 128
    controller_config:
      # Holonomic. The base was imported as a real four-wheel one first, and
      # that does not survive a teleport: the wheels arrive intersecting the
      # floor and PhysX ejects the robot, which reads as bouncing. The six
      # virtual joints have nothing to interpenetrate.
      base:
        name: HolonomicBaseJointController
        motor_type: position
        command_input_limits: null
        # No use_delta_commands: this controller does not take it, and leaving
        # JointController's parameters behind when swapping the name fails at
        # load with "unexpected keyword argument". r1_primitives.yaml's base
        # block is the reference.
        use_impedances: false
      arm_0:
        name: JointController
        motor_type: position
        command_input_limits: null
        use_delta_commands: false
        use_impedances: false

objects: []
task:
  type: DummyTask
